<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Skylark Courier — Island Air Mail</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1018; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #menu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(6,12,20,0.25) 0%, rgba(6,12,20,0.62) 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eaf2f8;
    padding: 24px; box-sizing: border-box; overflow-y: auto;
  }
  #menu[hidden] { display: none; }
  .panel {
    background: rgba(10, 18, 28, 0.92); border: 1px solid rgba(127, 231, 255, 0.35);
    border-radius: 18px; padding: 30px 36px; max-width: 780px; width: 100%;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }
  .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.22em; font-weight: 700; color: #7fe7ff; }
  h1 { margin: 0 0 10px; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; }
  .lede { margin: 0 0 18px; font-size: 17px; line-height: 1.55; color: #c9d8e4; }
  .controls { font-size: 13.5px; line-height: 1.6; color: #9fb2c1; margin: 14px 0 4px; }
  .controls b { color: #eaf2f8; }
  .best { font-size: 13.5px; color: #ffb347; margin: 10px 0 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 6px 0 4px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
    background: rgba(127, 231, 255, 0.07); border: 1px solid rgba(127, 231, 255, 0.3);
    border-radius: 12px; padding: 14px; color: #eaf2f8; font-family: inherit;
  }
  .card:hover, .card:focus-visible { background: rgba(127, 231, 255, 0.16); border-color: #7fe7ff; outline: none; }
  .card-tag { font-size: 11px; letter-spacing: 0.14em; font-weight: 700; color: #7fe7ff; }
  .card-name { font-size: 19px; font-weight: 800; }
  .card-brief { font-size: 13px; line-height: 1.45; color: #c9d8e4; }
  .card-par { font-size: 12px; color: #ffb347; font-weight: 700; }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 12px 22px; border-radius: 10px; border: 1px solid rgba(127, 231, 255, 0.5);
    background: transparent; color: #eaf2f8;
  }
  .btn:hover, .btn:focus-visible { border-color: #7fe7ff; outline: none; }
  .btn.primary { background: #ffb347; border-color: #ffb347; color: #231303; }
  .btn.primary:hover { background: #ffc46b; }
  .score-big { font-size: 56px; font-weight: 800; margin: 4px 0 12px; color: #ffb347; }
  .score-big span { font-size: 18px; color: #c9d8e4; font-weight: 600; }
  ul.debrief { margin: 0 0 6px; padding-left: 20px; font-size: 15.5px; line-height: 1.7; color: #c9d8e4; }
  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    h1 { font-size: 32px; }
    .panel { padding: 22px; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Skylark Courier: fly the mail plane across Kestrel Island"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="menu" hidden></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
